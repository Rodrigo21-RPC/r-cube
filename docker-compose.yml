# Postgres local para desarrollo y pruebas. Nunca se usa en producción (Supabase).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rcube
      POSTGRES_USER: rcube
      POSTGRES_PASSWORD: rcube_local
    ports:
      - "54329:5432"
    volumes:
      - rcube-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcube -d rcube"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  rcube-pg:
